<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header>
        <h1>PRIME UNIVERSITY</h1>
        <p>Student registration form</p>
    </header>
    <div class="box">
            <form>
        <h1>Registration form for student</h1>
        <div class="profile">
            <label for="image" >Profile pic:</label>
            <input type="file" name="image" id="image" accept="image/*">
            &nbsp;&nbsp;&nbsp;
            <button>upload</button>
        </div>
        <br><br>
        <div>
            <label for="name" >Name:</label>
            <input type="text" name="name" id="name" placeholder="josh">
        </div>
        <br><br>
        <div>
            <label for="email" >Email:</label>
            <input type="email" name="email" id="email" placeholder="a@gmail.com">
        </div>
        <br><br>
        
        <div>
            <label for="city" >City:</label>
            <input type="text" name="city" id="city" placeholder="Dhaka">
        </div>
        <br><br>
        <div>
            <label for="phone" >Phone :</label>
            <input type="tel" name="phone" id="phone" placeholder="018xxxxxxxx">
        </div>
        <br><br>
        <div>
            <label>Gender:</label>
            <input type="radio" name="gender" value="Male">Male
            <input type="radio" name="gender"  value="Female">Female
            
            
        </div>
        <br><br>

        <div>
            <label for="date" >Date of birth:</label>
            <input type="date" name="date" id="date">
        </div>
        <br><br>
        <div>
            <label for="name" >website:</label>
            <input type="url" name="name" id="name" placeholder="https://google.com">
        </div>
        <br><br>
        <div>
            <label for="skill" >skills:</label>
            <input type="checkbox" name="skill" id="skill" value="Python">Python
            <input type="checkbox" name="skill" id="skill" value="CSS">CSS
            <input type="checkbox" name="skill" id="skill" value="HTML">HTML
            <input type="checkbox" name="skill" id="skill" value="JAVASCRIPT">JAVASRIPT
            <input type="checkbox" name="skill" id="skill" value="C++">C++
            <input type="checkbox" name="skill" id="skill" value="JAVA">JAVA
            <input type="checkbox" name="skill" id="skill" value="DJANGO">DJANGO

        </div>
        <br><br>
        <div>
            <label for="dept" >Department:</label>
            <select id="dept" name="dept">
                <option>CSE</option>
                <option>EEE</option>
                <option>BBA</option>
                <option>MATH</option>
                
            </select>           
        </div>
        <br><br>
        <button>submit</button>
        &nbsp;&nbsp;&nbsp;
        <button>reset</button>
    </form>
    </div>

    <br><br><br><br>
    <footer>
        Designed by:Monir
    </footer>
    
</body>
</html>
